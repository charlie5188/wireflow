<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Kiln Tasks (demo)</title>
<style>
:root {
  --bg: #eceae3;
  --band: rgba(255, 255, 255, 0.4);
  --band-line: #d3cec2;
  --ink: #26241f;
  --muted: #6b675d;
  --card: #fffef9;
  --card-line: #e2ddd0;
  --key: #c2562b;
  --other: #8a8578;
  --pin: #c2562b;
  --note: #3d6e8f;
  --req: #7b4fa6;
  --chip: #f3efe4;
  --ui: #ffffff;
  --ui-line: #dcd7cb;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #1d1c1a; --band: rgba(255,255,255,0.03); --band-line: #3a3833; --ink: #ece8de; --muted: #a39e92;
    --card: #2a2825; --card-line: #3f3c36; --key: #e27a4f; --other: #8f897c; --pin: #e27a4f; --note: #6fa3c6; --req: #b28fd6;
    --chip: #34322d; --ui: #262421; --ui-line: #3d3a34;
  }
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; overflow: hidden; background: var(--bg); color: var(--ink);
  font: 14px/1.5 -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Noto Sans JP", "Segoe UI", sans-serif; }
#viewport { position: fixed; inset: 0; cursor: grab; touch-action: none; outline: none; }
#viewport.dragging { cursor: grabbing; }
#world { position: absolute; left: 0; top: 0; transform-origin: 0 0; }
#world.animate { transition: transform 420ms cubic-bezier(.2,.7,.2,1); }

.band { position: absolute; border: 3px dashed var(--band-line); border-radius: 48px; background: var(--band); }
.band-label { position: absolute; left: 56px; top: 40px; white-space: nowrap;
  font-weight: 700; color: var(--muted); font-size: min(320px, max(64px, calc(16px * var(--inv)))); line-height: 1; }

.screen { position: absolute; border-radius: 18px; box-shadow: 0 6px 30px rgba(0,0,0,.14); background: #fff; cursor: zoom-in; }
.screen img { display: block; width: 100%; height: 100%; border-radius: 18px; }
.screen-title { position: absolute; left: 0; bottom: 100%; margin-bottom: 22px; max-width: calc(100% + var(--side));
  display: flex; align-items: baseline; gap: 0.5em; white-space: nowrap; overflow: hidden;
  font-size: min(190px, max(44px, calc(13px * var(--inv)))); font-weight: 650; line-height: 1.1; }
.screen-title .name { overflow: hidden; text-overflow: ellipsis; min-width: 0; }
.screen-title .sid { flex: none; font: 600 0.55em/1 ui-monospace, SFMono-Regular, Menlo, monospace; color: var(--muted); }
body:not([data-ids="on"]) .screen-title .sid { display: none; }
/* Copies "ID · title", a precise name to paste into a request for changes. */
.copy { flex: none; align-self: center; font-size: inherit; width: 0.8em; height: 0.8em; padding: 0.1em; border: 0; border-radius: 0.2em;
  background: transparent; color: var(--muted); cursor: pointer; display: grid; place-items: center; }
.copy svg { width: 100%; height: 100%; }
.copy:hover, .copy:focus-visible { background: var(--chip); color: var(--ink); outline: none; }
.copy.done { color: var(--key); }
#toast { position: fixed; left: 50%; top: 80px; transform: translateX(-50%); z-index: 30; padding: 6px 12px; border-radius: 8px;
  background: var(--ink); color: var(--bg); font-size: 13px; pointer-events: none; }
#toast[hidden] { display: none; }
#world.has-focus .screen:not(.lit) { opacity: .45; }
#world .screen, #world .comments { transition: opacity 160ms; }
#world.has-focus .comments:not(.lit) { opacity: .45; }

/* A pin's pointed corner touches the top corner of what it marks, and its body sits
 * outside that area, so the marked control stays visible. */
.pin { position: absolute; width: var(--pin-size); height: var(--pin-size); margin: calc(var(--pin-size) * -1) 0 0 0; padding: 0;
  border-radius: 50% 50% 50% 4px; background: var(--pin); color: #fff; display: grid; place-items: center; cursor: pointer;
  font: 700 calc(var(--pin-size) * 0.5)/1 inherit; box-shadow: 0 2px 8px rgba(0,0,0,.25);
  border: calc(var(--pin-size) * 0.08) solid #fff; z-index: 2; transition: transform 120ms; transform-origin: 0 100%; }
.pin.flip { margin-left: calc(var(--pin-size) * -1); border-radius: 50% 50% 4px 50%; transform-origin: 100% 100%; }
.pin.note { background: var(--note); }
.pin:hover, .pin.on, .pin:focus-visible { transform: scale(1.25); outline: none; z-index: 3; }
.hl-ring { position: absolute; border: 6px solid var(--pin); border-radius: 10px; pointer-events: none; opacity: 0; transition: opacity 120ms; }
.hl-ring.note { border-color: var(--note); }
.hl-ring.on { opacity: 1; }
.card.on { box-shadow: 0 0 0 6px var(--pin); }
.card.note.on { box-shadow: 0 0 0 6px var(--note); }

/* The pin's comment, shown at screen size beside the pin on hover or click. */
#bubble { position: fixed; z-index: 20; max-width: 340px; background: var(--card); border: 1px solid var(--card-line);
  border-radius: 12px; padding: 12px 14px 12px 46px; font-size: 14px; line-height: 1.45; box-shadow: 0 8px 28px rgba(0,0,0,.18); }
#bubble[hidden] { display: none; }
#bubble .num { position: absolute; left: 12px; top: 12px; width: 24px; height: 24px; border-radius: 50% 50% 50% 3px;
  background: var(--pin); color: #fff; display: grid; place-items: center; font-weight: 700; font-size: 12px; }
#bubble.note .num { background: var(--note); }
#bubble .trigger { font-weight: 650; }
#bubble .effect { color: var(--muted); }
#bubble .go { margin-top: 8px; display: inline-flex; gap: 6px; align-items: center; padding: 3px 10px; border-radius: 999px;
  background: var(--chip); border: 1px solid var(--card-line); color: var(--ink); font: inherit; font-size: 13px; cursor: pointer; }
#bubble .go:hover, #bubble .go:focus-visible { border-color: var(--key); outline: none; }
#bubble .back { color: var(--muted); }

#navigator { position: fixed; z-index: 10; right: max(16px, env(safe-area-inset-right, 0px)); bottom: 16px; display: flex; flex-direction: column;
  background: var(--ui); border: 1px solid var(--ui-line); border-radius: 12px; box-shadow: 0 4px 18px rgba(0,0,0,.08); overflow: hidden; }
#minimap { padding: 8px; cursor: pointer; touch-action: none; border-bottom: 1px solid var(--ui-line); display: flex; justify-content: center; }
#zoom { display: flex; align-items: center; justify-content: space-between; gap: 2px; padding: 4px; }
#minimap svg { display: block; }
#minimap .m-band { fill: var(--band-line); opacity: .35; }
#minimap .m-screen { fill: var(--other); }
#minimap .m-view { fill: rgba(194, 86, 43, .12); stroke: var(--key); }
@media (max-width: 720px) { #minimap { display: none; } }

/* Edit mode: text is editable in place, controls appear on each card, and a click on a
 * screen drops a new pin. Requests are dashed: they ask the agent to look into something. */
.edit-bar { display: none; margin-top: 12px; gap: 10px; flex-wrap: wrap; align-items: center; font-size: 20px; }
body[data-edit="on"] .edit-bar { display: flex; }
.edit-bar button, .edit-bar label { font: inherit; font-size: 20px; color: var(--muted); background: var(--chip);
  border: 2px solid var(--card-line); border-radius: 999px; padding: 4px 14px; cursor: pointer; display: inline-flex; gap: 8px; align-items: center; }
.edit-bar button:hover, .edit-bar label:hover, .edit-bar button[aria-pressed="true"] { color: var(--ink); border-color: var(--key); }
.edit-bar input { width: 18px; height: 18px; accent-color: var(--key); }
body[data-edit="on"] [data-field] { outline: 2px dashed transparent; outline-offset: 4px; border-radius: 6px; cursor: text; }
body[data-edit="on"] [data-field]:hover, body[data-edit="on"] [data-field]:focus { outline-color: var(--card-line); }
body[data-edit="on"] [data-field]:focus { outline-color: var(--key); }
[data-field]:empty::before { content: attr(data-placeholder); color: var(--muted); }
.card.changed { border-style: solid; border-color: var(--note); }
.card.deleted { opacity: .5; }
.card.deleted [data-field] { text-decoration: line-through; }
.pin.deleted { opacity: .35; }
.card.request { border-style: dashed; border-color: var(--req); }
.card.request .num, .pin.request, #bubble.request .num { background: var(--req); }
.hl-ring.request { border-color: var(--req); }
.add-request { display: none; font: inherit; font-size: 22px; color: var(--muted); background: transparent;
  border: 2px dashed var(--card-line); border-radius: 22px; padding: 18px; cursor: pointer; }
body[data-edit="on"] .add-request { display: block; }
.add-request:hover { color: var(--ink); border-color: var(--req); }
body[data-edit="on"] .screen { cursor: crosshair; }
/* On/off settings are switches: a track with a knob that slides right when on. */
.toggle { display: inline-flex; align-items: center; gap: 8px; }
.toggle .track { position: relative; width: 28px; height: 16px; border-radius: 999px; background: var(--ui-line); transition: background 150ms; flex: none; }
.toggle .track::after { content: ""; position: absolute; top: 2px; left: 2px; width: 12px; height: 12px; border-radius: 50%;
  background: var(--ui); box-shadow: 0 1px 2px rgba(0,0,0,.25); transition: transform 150ms; }
.toggle[aria-checked="true"] .track { background: var(--key); }
.toggle[aria-checked="true"] .track::after { transform: translateX(12px); }
@media (prefers-reduced-motion: reduce) { .toggle .track, .toggle .track::after { transition: none; } }
#changes-btn { font-weight: 600; color: var(--key); }
#changes-btn[aria-expanded="true"] { background: var(--chip); }
/* One popover under Changes (n), like the View menu. With no changes it holds the few tips a
 * reader needs; with changes it is a one-line summary (details on demand) and the copy button,
 * because what readers want from it is the text for their AI agent. */
#changes { position: absolute; right: 0; top: calc(100% + 6px); width: min(340px, calc(100vw - 32px)); max-height: calc(100vh - 160px);
  display: flex; flex-direction: column; background: var(--ui); border: 1px solid var(--ui-line); border-radius: 12px;
  box-shadow: 0 8px 28px rgba(0,0,0,.14); font-size: 13px; line-height: 1.45; overflow: hidden; }
#changes[hidden] { display: none; }
#changes .tips { margin: 0; padding: 12px 14px 12px 30px; display: flex; flex-direction: column; gap: 4px; }
#changes .tips .muted { color: var(--muted); list-style: none; margin: 4px 0 0 -16px; }
#changes .summary { display: flex; align-items: center; gap: 8px; width: 100%; border: 0; background: transparent; color: var(--ink);
  font: inherit; text-align: left; padding: 10px 14px; cursor: pointer; }
#changes .summary:hover { background: var(--chip); }
#changes .summary:focus-visible { outline: 2px solid var(--key); outline-offset: -2px; }
#changes .summary .chev { display: inline-flex; color: var(--muted); transition: transform 150ms; }
#changes .summary[aria-expanded="true"] .chev { transform: rotate(90deg); }
@media (prefers-reduced-motion: reduce) { #changes .summary .chev { transition: none; } }
#changes .list { overflow: auto; padding: 0 14px 8px; }
#changes .group-title { display: flex; align-items: center; gap: 4px; max-width: 100%; margin: 8px 0 2px; padding: 0; border: 0; background: transparent;
  font: inherit; font-size: 12px; font-weight: 600; color: var(--ink); cursor: pointer; text-align: left; }
#changes .group-title .arrow { color: var(--muted); }
#changes .group-title:hover, #changes .group-title:focus-visible, #changes .group-title:hover .arrow, #changes .group-title:focus-visible .arrow { color: var(--key); outline: none; }
#changes .group-title:hover { text-decoration: underline; text-underline-offset: 2px; }
#changes .item { display: flex; gap: 6px; align-items: baseline; padding: 2px 0; }
#changes .item .n { flex: none; color: var(--muted); font-variant-numeric: tabular-nums; }
#changes .item .text { flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
#changes .item button { flex: none; border: 0; background: transparent; color: var(--muted); cursor: pointer; font: inherit; padding: 0 2px; }
#changes .item button:hover, #changes .item button:focus-visible { color: var(--key); }
#changes footer { display: flex; gap: 8px; align-items: center; justify-content: space-between; padding: 10px 14px; border-top: 1px solid var(--ui-line); }
#changes footer button { font: inherit; font-size: 13px; padding: 6px 12px; border-radius: 8px; cursor: pointer; border: 1px solid var(--ui-line); background: var(--ui); color: var(--ink); }
#changes footer .quiet { border-color: transparent; color: var(--muted); padding-left: 0; padding-right: 0; }
#changes footer .quiet:hover { color: var(--ink); }
#changes footer .primary { background: var(--key); border-color: var(--key); color: #fff; font-weight: 600; display: inline-flex; align-items: center; gap: 6px; }

.comments { position: absolute; display: flex; flex-direction: column; gap: 22px; }
.card { position: relative; background: var(--card); border: 2px solid var(--card-line); border-radius: 22px;
  padding: 22px 26px 22px 84px; font-size: 25px; line-height: 1.45; box-shadow: 0 2px 10px rgba(0,0,0,.06); cursor: default; }
.card.key { border-color: var(--key); }
.card .num { position: absolute; left: 22px; top: 20px; width: 44px; height: 44px; border-radius: 50% 50% 50% 6px;
  background: var(--pin); color: #fff; display: grid; place-items: center; font-weight: 700; font-size: 22px; }
.card.note .num { background: var(--note); }
.card .trigger { font-weight: 650; }
.card .effect { color: var(--muted); }
.card .go { margin-top: 10px; display: inline-flex; align-items: center; gap: 10px; padding: 6px 16px 6px 12px;
  border-radius: 999px; background: var(--chip); border: 2px solid var(--card-line); color: var(--ink);
  font: inherit; font-size: 22px; cursor: pointer; }
.card .go:hover, .card .go:focus-visible { border-color: var(--key); outline: none; }
.card .go .sid { font: 600 18px/1 ui-monospace, SFMono-Regular, Menlo, monospace; color: var(--muted); }
.card .back { font-size: 20px; color: var(--muted); }
#world[data-lod="far"] .comments { visibility: hidden; }
#world[data-lod="far"] .leaders { visibility: hidden; }

svg.layer { position: absolute; left: 0; top: 0; overflow: visible; pointer-events: none; }
.edge path.line { fill: none; stroke-linecap: round; }
.edge.key path.line { stroke: var(--key); }
.edge.other path.line { stroke: var(--other); }
.edge.key path.head { fill: var(--key); }
.edge.other path.head { fill: var(--other); }
.edge.other { opacity: .7; }
#world.mode-key .edge.other { display: none; }
#world.mode-key .edge.other.lit { display: inline; }
#world.has-focus .edge:not(.lit) { opacity: .12; }
.edge circle.start { fill: var(--card); }
.edge.key circle.start { stroke: var(--key); }
.edge.other circle.start { stroke: var(--other); }
/* A leader appears only while its card is hovered; numbers pair pins and cards otherwise. */
.leaders line { stroke: var(--pin); opacity: 0; transition: opacity 120ms; }
.leaders line.lit { opacity: 1; }

.toolbar { position: fixed; z-index: 10; display: flex; align-items: center; gap: 6px; padding: 6px;
  background: var(--ui); border: 1px solid var(--ui-line); border-radius: 12px; box-shadow: 0 4px 18px rgba(0,0,0,.08); }
#top { left: max(16px, env(safe-area-inset-left, 0px)); top: 16px; max-width: calc(100vw - 32px); }
#actions { right: max(16px, env(safe-area-inset-right, 0px)); top: 16px; }
#view-menu { position: absolute; left: 0; top: calc(100% + 6px); min-width: 248px; display: flex; flex-direction: column; align-items: stretch; gap: 2px;
  padding: 6px; background: var(--ui); border: 1px solid var(--ui-line); border-radius: 12px; box-shadow: 0 8px 28px rgba(0,0,0,.14); }
#view-menu[hidden] { display: none; }
/* Laid out as a menu: every row has its name on the left and its control or shortcut on the right,
 * in one column. Dividers split the settings, the Figma view and the legend. */
#view-menu .row { display: flex; align-items: center; justify-content: space-between; gap: 16px; min-height: 34px; padding: 0 8px; border-radius: 7px; }
#view-menu .toggle .track { order: 1; }
#view-menu .seg button { padding: 3px 10px; font-size: 12px; }
#view-menu .menu-sep { height: 1px; background: var(--ui-line); margin: 4px 2px; }
#view-menu kbd { font: inherit; font-size: 12px; color: var(--muted); }
#view-menu .legend { display: grid; grid-template-columns: 1fr 1fr; gap: 6px 16px; padding: 6px 8px 4px; }
#view-menu .legend span { white-space: nowrap; }
#view-btn[aria-expanded="true"] { background: var(--chip); }
.toolbar h1 { margin: 0 8px; font-size: 15px; font-weight: 700; white-space: nowrap; }
.seg { display: inline-flex; background: var(--bg); border-radius: 9px; padding: 2px; }
.seg button, .tool { border: 0; background: transparent; color: var(--ink); font: inherit; font-size: 13px;
  padding: 6px 10px; border-radius: 7px; cursor: pointer; white-space: nowrap; }
.seg button[aria-pressed="true"] { background: var(--ui); box-shadow: 0 1px 3px rgba(0,0,0,.12); font-weight: 600; }
.tool[aria-pressed="true"] { background: var(--chip); font-weight: 600; }
.tool:hover, .seg button:hover { background: var(--chip); }
.tool:focus-visible, .seg button:focus-visible { outline: 2px solid var(--key); outline-offset: 1px; }
.sep { width: 1px; align-self: stretch; background: var(--ui-line); margin: 0 4px; }
#pct { min-width: 48px; text-align: center; font-variant-numeric: tabular-nums; color: var(--muted); font-size: 13px; }
.legend { display: flex; gap: 12px; align-items: center; color: var(--muted); font-size: 12px; padding: 0 6px; }
.legend i { display: inline-block; width: 22px; height: 0; border-top: 3px solid var(--key); vertical-align: middle; margin-right: 4px; }
.legend i.other { border-top: 2px dashed var(--other); }
.legend b { display: inline-grid; place-items: center; width: 16px; height: 16px; border-radius: 50% 50% 50% 3px;
  background: var(--pin); color: #fff; font-size: 10px; margin-right: 4px; vertical-align: middle; }
.legend b.note { background: var(--note); }

/* Figma view (?figma): the whole map at 100 % as one plain page that scrolls. Titles must not
 * clip, because Figma swaps the system font for a slightly wider one. */
html[data-figma="on"], html[data-figma="on"] body { height: auto; overflow: visible; }
html[data-figma="on"] #viewport { position: relative; inset: auto; cursor: auto; pointer-events: none; }
html[data-figma="on"] :is(#top, #actions, #navigator, #bubble, #toast, .copy) { display: none; }
html[data-figma="on"] :is(.screen-title, .screen-title .name) { overflow: visible; text-overflow: clip; }

</style>
</head>
<body>
<!-- Like FigJam: the file name and its view settings at top left, editing at top right. -->
<div class="toolbar" id="top">
  <h1 id="doc-title"></h1>
  <div class="sep"></div>
  <button type="button" class="tool" id="view-btn" aria-expanded="false" aria-controls="view-menu"><span class="label"></span> <span aria-hidden="true">▾</span></button>
  <div id="view-menu" hidden>
    <div class="row">
      <span id="lang-label"></span>
      <div class="seg" role="group" id="lang-seg" aria-labelledby="lang-label">
        <button type="button" data-lang="en">EN</button>
        <button type="button" data-lang="ja">日本語</button>
      </div>
    </div>
    <button type="button" class="tool toggle row" id="paths-toggle" role="switch" aria-checked="false"><span class="track" aria-hidden="true"></span><span class="label"></span></button>
    <button type="button" class="tool toggle row" id="ids-toggle" role="switch" aria-checked="false"><span class="track" aria-hidden="true"></span><span class="label"></span></button>
    <div class="menu-sep" role="separator"></div>
    <button type="button" class="tool row" id="figma-btn"><span class="label"></span><kbd></kbd></button>
    <div class="menu-sep" role="separator"></div>
    <div class="legend" id="legend"></div>
  </div>
</div>
<div class="toolbar" id="actions">
  <button type="button" class="tool toggle" id="edit-toggle" role="switch" aria-checked="false"><span class="track" aria-hidden="true"></span><span class="label"></span></button>
  <button type="button" class="tool" id="changes-btn" aria-expanded="false" aria-controls="changes" hidden></button>
  <section id="changes" aria-label="Changes" hidden></section>
</div>
<!-- Bottom right, as in Figma: where you are (minimap) and how close you are (zoom), together. -->
<div id="navigator">
<div id="minimap" aria-hidden="true"></div>
<div id="zoom">
  <button type="button" class="tool" id="zoom-out">−</button>
  <span id="pct">100%</span>
  <button type="button" class="tool" id="zoom-in">+</button>
  <div class="sep"></div>
  <button type="button" class="tool" id="fit"></button>
</div>
</div>
<div id="bubble" role="dialog" hidden></div>
<div id="toast" role="status" hidden></div>
<div id="viewport" tabindex="0">
  <div id="world"></div>

  }
  const groups = new Map();
  for (const c of list) { if (!groups.has(c.s.id)) groups.set(c.s.id, []); groups.get(c.s.id).push(c); }
  // Collapsed by default: the canvas already marks each change, so the list is for checking
  // or undoing one, not something every reader needs before copying.
  const summary = el("button", "summary"); summary.type = "button";
  summary.setAttribute("aria-expanded", String(changesExpanded)); summary.setAttribute("aria-controls", "changes-list");
  const chev = el("span", "chev"); chev.setAttribute("aria-hidden", "true");
  chev.innerHTML = '<svg viewBox="0 0 12 12" width="12" height="12" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M4.5 2.5 8 6l-3.5 3.5"/></svg>';
  summary.append(chev, el("span", "", UI[lang].summary(list.length, groups.size)));
  summary.onclick = () => { changesExpanded = !changesExpanded; renderChanges(); changesPanel.querySelector(".summary").focus(); };
  const parts = [summary];
  if (changesExpanded) {
    const body = el("div", "list"); body.id = "changes-list";
    for (const [id, items] of groups) {
      // The page name jumps to that page, where each change is marked on its card. The popover
      // closes so it does not cover the cards it points at.
      const go = el("button", "group-title", t(byId[id].title)); go.type = "button"; go.title = `${UI[lang].go}: ${t(byId[id].title)}`;
      const arrow = el("span", "arrow", "→"); arrow.setAttribute("aria-hidden", "true"); go.append(arrow);
      go.onclick = () => { setChanges(false); flyTo(id); viewport.focus({ preventScroll: true }); };
      body.append(go);
      for (const c of items) {
        const row = el("div", "item"); const text = el("span", "text", c.short); text.title = c.short;
        const undo = el("button", "", UI[lang].undo); undo.type = "button";
        undo.onclick = () => { c.undo(); saveEdits(); rebuild(); (changesPanel.querySelector(".summary") || changesBtn).focus(); };
        row.append(el("span", "n", `#${c.num}`), text, undo); body.append(row);
      }
    }
    parts.push(body);
  }
  const footer = el("footer");
  const clear = el("button", "quiet", UI[lang].clear); clear.type = "button";
  clear.onclick = () => {
    if (!clearArmed) { clearArmed = true; clear.textContent = UI[lang].clearConfirm; setTimeout(() => { clearArmed = false; clear.textContent = UI[lang].clear; }, 3000); return; }
    clearArmed = false; edits = { text: {}, del: {}, key: {}, adds: [] }; saveEdits(); rebuild();
  };
  const copy = el("button", "primary"); copy.type = "button";
  copy.innerHTML = '<svg viewBox="0 0 16 16" width="14" height="14" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><rect x="5" y="5" width="9" height="9" rx="1.5"/><path d="M11 5V3.5A1.5 1.5 0 0 0 9.5 2h-6A1.5 1.5 0 0 0 2 3.5v6A1.5 1.5 0 0 0 3.5 11H5"/></svg>';
  copy.append(UI[lang].copyChanges);
  copy.onclick = () => copyText(changesText(list), copy, UI[lang].copiedChanges);
  footer.append(clear, copy);
  changesPanel.replaceChildren(...parts, footer);
}

function copyText(text, btn, message) {
  const done = () => {
    btn.classList.add("done"); setTimeout(() => btn.classList.remove("done"), 1200);
    const toast = document.getElementById("toast"); toast.textContent = message || `${UI[lang].copied}: ${text}`; toast.hidden = false;
    clearTimeout(copyText.timer); copyText.timer = setTimeout(() => { toast.hidden = true; }, 1600);
  };
  const fallback = () => {
    const area = el("textarea"); area.value = text; area.style.position = "fixed"; area.style.opacity = "0";
    document.body.append(area); area.select();
    try { document.execCommand("copy"); done(); } catch (err) {} area.remove();
  };
  if (navigator.clipboard?.writeText) navigator.clipboard.writeText(text).then(done, fallback); else fallback();
}
const viewBtn = document.getElementById("view-btn"), viewMenu = document.getElementById("view-menu");
const setViewMenu = open => { viewMenu.hidden = !open; viewBtn.setAttribute("aria-expanded", String(open)); };
viewBtn.onclick = () => setViewMenu(viewMenu.hidden);
document.addEventListener("pointerdown", e => { if (!viewMenu.hidden && !e.target.closest("#top")) setViewMenu(false); });
document.addEventListener("keydown", e => { if (e.key === "Escape" && !viewMenu.hidden) { setViewMenu(false); viewBtn.focus(); } });
document.getElementById("paths-toggle").onclick = e => {
  mode = mode === "all" ? "key" : "all"; store.set("flow-mode", mode);
  world.className = "mode-" + mode; e.currentTarget.setAttribute("aria-checked", String(mode === "all"));
};
addEventListener("resize", () => apply(false));

// The Figma view is set up only while the page loads (see below), so switching reloads the page with
// or without ?figma. ⌘\ (Ctrl+\) goes both ways, like Show/Hide UI in Figma; Esc leaves. Leaving
// returns to the spot the reader left, not to Fit all.
const RETURN_KEY = "flow-return";
function setFigma(on) {
  if (on) try { sessionStorage.setItem(RETURN_KEY, JSON.stringify({ scale, tx, ty })); } catch (e) {}
  const u = new URL(location.href); u.search = on ? "?figma" : "";
  if (on) location.assign(u); else location.replace(u);
}
document.querySelector("#figma-btn kbd").textContent = /Mac|iPhone|iPad/.test(navigator.platform) ? "⌘\\" : "Ctrl+\\";
document.getElementById("figma-btn").onclick = () => setFigma(true);
document.addEventListener("keydown", e => {
  if (e.target.isContentEditable || e.target.closest?.("input, textarea")) return;
  // ¥ is the same key on Japanese keyboards.
  if ((e.metaKey || e.ctrlKey) && (e.key === "\\" || e.key === "¥")) { e.preventDefault(); setFigma(figma === null); }
  else if (e.key === "Escape" && figma !== null) setFigma(false);
});

if (figma !== null) {
  // Nothing may sit above or left of the canvas origin: Figma's import drops text placed there
  // (the top band's title and the first screen's name went missing).
  const b = bounds();
  for (const s of screens) { s.x -= b.x0; s.y -= b.y0; }
}
build();
if (figma !== null) {
  // Figma view: the whole map at 100 % with no toolbars and no pointer handling, so a
  // page-to-design import (such as Figma's browser extension) takes in every screen, arrow, pin
  // and comment at full size, not only the part a window shows.
  document.documentElement.dataset.figma = "on";
  const b = bounds();
  Object.assign(viewport.style, { width: (b.x1 - b.x0) + "px", height: (b.y1 - b.y0) + "px" });
  scale = 1; tx = -b.x0; ty = -b.y0; apply(false);
  // Open on the first screen, not on empty canvas; an import still takes in the whole page.
  scrollTo(Math.max(0, screens[0].x - b.x0 - 160), Math.max(0, screens[0].y - b.y0 - 200));
} else {
  let back = null;
  try { back = JSON.parse(sessionStorage.getItem(RETURN_KEY)); sessionStorage.removeItem(RETURN_KEY); } catch (e) {}
  const start = decodeURIComponent(location.hash.slice(1));
  if (back) { ({ scale, tx, ty } = back); apply(false); }
  else if (byId[start]) fitTo(bounds([start]), false); else fitTo(bounds(), false);
}
</script>
</body>
